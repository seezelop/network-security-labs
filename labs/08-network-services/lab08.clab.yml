name: lab08

topology:
  nodes:
    client01:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache bind-tools chrony tcpdump

    dhcp01:
      kind: linux
      image: alpine:latest
      binds:
        - configs/dhcp/dnsmasq.conf:/etc/dnsmasq.conf
      exec:
        - apk add --no-cache dnsmasq tcpdump
        - ip addr add 10.20.10.2/24 dev eth1
        - ip route replace default via 10.20.10.1 dev eth1
        - dnsmasq --conf-file=/etc/dnsmasq.conf

    r01:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.20.10.1/24 dev eth1
        - ip addr add 10.20.20.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1

    dns01:
      kind: linux
      image: alpine:latest
      binds:
        - configs/dns/dnsmasq.conf:/etc/dnsmasq.conf
      exec:
        - apk add --no-cache dnsmasq bind-tools tcpdump
        - ip addr add 10.20.20.10/24 dev eth1
        - ip route replace default via 10.20.20.1 dev eth1
        - dnsmasq --conf-file=/etc/dnsmasq.conf

    ntp01:
      kind: linux
      image: alpine:latest
      binds:
        - configs/ntp/chrony.conf:/etc/chrony-lab.conf
      exec:
        - apk add --no-cache chrony tcpdump
        - ip addr add 10.20.20.20/24 dev eth1
        - ip route replace default via 10.20.20.1 dev eth1
        - chronyd -x -f /etc/chrony-lab.conf

    sw01:
      kind: ovs-bridge

    sw02:
      kind: ovs-bridge

  links:
    - endpoints: ["client01:eth1", "sw01:client"]
    - endpoints: ["dhcp01:eth1", "sw01:dhcp"]
    - endpoints: ["r01:eth1", "sw01:router-client"]

    - endpoints: ["r01:eth2", "sw02:router-services"]
    - endpoints: ["dns01:eth1", "sw02:dns"]
    - endpoints: ["ntp01:eth1", "sw02:ntp"]
