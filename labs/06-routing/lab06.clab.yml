name: lab06

topology:
  nodes:
    user01:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 tcpdump
        - ip addr add 10.10.10.10/24 dev eth1
        - ip route replace default via 10.10.10.1 dev eth1

    server01:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 tcpdump
        - ip addr add 10.10.20.10/24 dev eth1
        - ip route replace default via 10.10.20.1 dev eth1

    r01:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 tcpdump
        - ip link set eth1 up
        - ip link add link eth1 name eth1.10 type vlan id 10
        - ip link add link eth1 name eth1.20 type vlan id 20
        - ip addr add 10.10.10.1/24 dev eth1.10
        - ip addr add 10.10.20.1/24 dev eth1.20
        - ip link set eth1.10 up
        - ip link set eth1.20 up
        - ip addr add 10.0.12.1/30 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
        - ip route del default

    r02:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 tcpdump
        - ip addr add 10.0.12.2/30 dev eth1
        - ip addr add 10.10.30.1/24 dev eth2
        - sysctl -w net.ipv4.ip_forward=1
        - ip route del default

    remote01:
      kind: linux
      image: alpine:latest
      exec:
        - apk add --no-cache iproute2 tcpdump
        - ip addr add 10.10.30.10/24 dev eth1
        - ip route replace default via 10.10.30.1 dev eth1

    sw01:
      kind: ovs-bridge

  links:
    - endpoints: ["user01:eth1", "sw01:sw01-user"]
    - endpoints: ["server01:eth1", "sw01:sw01-server"]
    - endpoints: ["r01:eth1", "sw01:sw01-trunk"]

    - endpoints: ["r01:eth2", "r02:eth1"]
    - endpoints: ["r02:eth2", "remote01:eth1"]
